---
- name: 变量与流程控制演示（when / loop / facts）
  hosts: web
  gather_facts: true
  tasks:
    - name: 仅 RedHat 系安装基础工具（when 条件判断）
      dnf:
        name: "{{ item }}"
        state: present
      loop:
        - vim-enhanced
        - curl
      when: ansible_os_family == "RedHat"

    - name: 输出每台主机的系统信息（facts 变量）
      debug:
        msg: "{{ ansible_hostname }} -> {{ ansible_os_family }} {{ ansible_distribution_version }} / {{ ansible_default_ipv4.address }}"

